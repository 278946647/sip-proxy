map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# LuCI may POST to /cgi-bin/... without /remote/{id}/ when loaded via reverse proxy.
map $http_referer $gfc_remote_device {
    default "";
    ~^https?://[^/]+/remote/(\d+)/ $1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # Reverse access to device LuCI / flash via control-plane HTTP proxy.
    # Keep /remote prefix (API router prefix="/remote"); do not strip like /api/.
    location /remote/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # Bare LuCI paths from in-page XHR (Referer carries /remote/{device}/).
    location /cgi-bin/ {
        if ($gfc_remote_device = "") {
            return 404;
        }
        proxy_pass http://host.docker.internal:8080/remote/$gfc_remote_device$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location /luci-static/ {
        if ($gfc_remote_device = "") {
            return 404;
        }
        proxy_pass http://host.docker.internal:8080/remote/$gfc_remote_device$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # index.html must not be cached — hashed assets under /assets/ are immutable
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
