services:
  api:
    build:
      context: ./control-plane/api
      dockerfile: Dockerfile
    network_mode: host
    environment:
      GFC_DATABASE_URL: sqlite+aiosqlite:////data/gfc.db
      GFC_PKI_DIR: /data/pki
      GFC_REVERSE_SSH_AUTHORIZED_KEYS_PATH: /data/reverse-ssh/authorized_keys
      GFC_BOOTSTRAP_TOKENS: ${GFC_BOOTSTRAP_TOKENS:-demo-bootstrap}
      GFC_ADMIN_DEFAULT_PASSWORD: ${GFC_ADMIN_DEFAULT_PASSWORD:-admin123}
      GFC_AUTH_SECRET: ${GFC_AUTH_SECRET:-change-me-in-production}
      GFC_PUBLIC_URL: ${GFC_PUBLIC_URL:-}
      GFC_PUBLIC_URL_FALLBACK: ${GFC_PUBLIC_URL_FALLBACK:-}
      GFC_PUBLIC_IP: ${GFC_PUBLIC_IP:-}
      GFC_PUBLIC_PORT: ${GFC_PUBLIC_PORT:-8181}
      GFC_REVERSE_SSH_CLIENT_SHELL_PASSWORD: ${GFC_REVERSE_SSH_CLIENT_SHELL_PASSWORD:-}
      GFC_REVERSE_SSH_CLIENT_SHELL_IDENTITY_PATH: ${GFC_REVERSE_SSH_CLIENT_SHELL_IDENTITY_PATH:-}
      GFC_ARTIFACTS_DIR: /data/artifacts
    volumes:
      - gfc-data:/data
      - /var/lib/gfc/reverse-ssh:/data/reverse-ssh
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  web:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

volumes:
  gfc-data:
