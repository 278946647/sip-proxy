# EasyMosDNS policy translated to mosdns v5 plugin syntax for GFC on ImmortalWrt/OpenWrt.
# dnsmasq keeps LAN :53 and forwards to this instance on 127.0.0.1:1053.
# Rules are rendered to /etc/gfc-client/mosdns/easymosdns.
# gfc_openwrt_mosdns_v6
log:
  level: error

plugins:
  - tag: china_domain
    type: domain_set
    args:
      files:
        - ./rules/china_domain_list.txt

  - tag: gfw_domain
    type: domain_set
    args:
      files:
        - ./rules/gfw_domain_list.txt

  - tag: cdn_domain
    type: domain_set
    args:
      files:
        - ./rules/cdn_domain_list.txt

  - tag: ad_domain
    type: domain_set
    args:
      files:
        - ./rules/ad_domain_list.txt

  - tag: ecs_cn_domain
    type: domain_set
    args:
      files:
        - ./ecs_cn_domain.txt

  - tag: ecs_noncn_domain
    type: domain_set
    args:
      files:
        - ./ecs_noncn_domain.txt

  - tag: china_ip
    type: ip_set
    args:
      files:
        - ./rules/china_ip_list.txt

  - tag: gfw_ip
    type: ip_set
    args:
      files:
        - ./rules/gfw_ip_list.txt

  - tag: cache_lan
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400

  - tag: cache_wan
    type: cache
    args:
      size: 131072
      lazy_cache_ttl: 86400

  - tag: forward_local
    type: forward
    args:
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29

  - tag: forward_remote
    type: forward
    args:
      upstreams:
        - addr: "https://1.1.1.1/dns-query"
          dial_addr: "1.1.1.1:443"
        - addr: "https://8.8.8.8/dns-query"
          dial_addr: "8.8.8.8:443"

  - tag: forward_easymosdns
    type: forward
    args:
      upstreams:
        - addr: "https://mosdns.apad.pro/api-query"
          bootstrap: "223.6.6.6"

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache_lan

      # EasyMosDNS adlist: block known ad domains.
      - matches:
          - qname $ad_domain
        exec: reject 3

      # EasyMosDNS ecscn/chinalist/cdncn: force local resolvers.
      - matches:
          - qname $ecs_cn_domain
        exec: $forward_local
      - matches:
          - qname $china_domain
        exec: $forward_local
      - matches:
          - qname $cdn_domain
        exec: $forward_local

      # EasyMosDNS ecsnoncn/gfwlist: force remote DoH. Kernel routing sends
      # 1.1.1.1:443 and 8.8.8.8:443 through gfctun.
      - matches:
          - qname $ecs_noncn_domain
        exec: $forward_remote
      - matches:
          - qname $gfw_domain
        exec: $forward_remote

      # Unknown domains follow the original "remote first" business goal.
      # nft CN-IP policy still keeps ordinary China IP traffic direct.
      - exec: $forward_remote

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053
