log:
  level: error

# EasyMosDNS equivalent policy for GFC on ImmortalWrt/OpenWrt.
# dnsmasq keeps LAN :53 and forwards to this instance on 127.0.0.1:1053.
# Rules are rendered to /etc/gfc-client/mosdns/easymosdns.
# gfc_openwrt_mosdns_v6

plugins:
  - tag: china_domain
    type: domain_set
    args:
      files:
        - ./rules/china_domain_list.txt

  - tag: gfw_domain
    type: domain_set
    args:
      files:
        - ./rules/gfw_domain_list.txt

  - tag: cdn_domain
    type: domain_set
    args:
      files:
        - ./rules/cdn_domain_list.txt

  - tag: ad_domain
    type: domain_set
    args:
      files:
        - ./rules/ad_domain_list.txt

  - tag: china_ip
    type: ip_set
    args:
      files:
        - ./rules/china_ip_list.txt

  - tag: gfw_ip
    type: ip_set
    args:
      files:
        - ./rules/gfw_ip_list.txt

  - tag: ecs_auto
    type: ecs
    args:
      auto: true

  - tag: ecs_local
    type: ecs
    args:
      auto: false
      ipv4: "101.6.6.0"
      ipv6: "2001:da8::"
      force_overwrite: false

  - tag: ecs_global
    type: ecs
    args:
      auto: false
      ipv4: "1.1.1.1"
      ipv6: "2001:4860:4860::8888"
      force_overwrite: true

  - tag: cache_lan
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400
      cache_everything: true

  - tag: cache_wan
    type: cache
    args:
      size: 131072
      lazy_cache_ttl: 86400
      cache_everything: true

  - tag: forward_local
    type: forward
    args:
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29

  - tag: forward_remote
    type: forward
    args:
      upstreams:
        - addr: "https://1.1.1.1/dns-query"
          dial_addr: "1.1.1.1:443"
        - addr: "https://8.8.8.8/dns-query"
          dial_addr: "8.8.8.8:443"

  - tag: forward_backup
    type: forward
    args:
      upstreams:
        - addr: "https://mosdns.apad.pro/api-query"
          bootstrap: "223.5.5.5"

  - tag: fix_gfw_ip
    type: sequence
    args:
      - matches:
          - resp_ip $gfw_ip
        exec:
          - ecs_local
          - forward_backup

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache_lan

      - matches:
          - qname $ad_domain
        exec:
          - blackhole
          - _return

      - matches:
          - qname $china_domain
        exec:
          - $forward_local
          - _return

      - matches:
          - qname $cdn_domain
        exec:
          - ecs_auto
          - $forward_local
          - _return

      - matches:
          - qname $gfw_domain
        exec:
          - ecs_global
          - $forward_remote
          - _return

      - exec:
          - ecs_auto

      - primary:
          - ecs_local
          - $forward_local
        secondary:
          - ecs_global
          - $forward_remote
        fast_fallback: 2000
        always_standby: false

      - exec: fix_gfw_ip

      - exec: $cache_wan

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053
