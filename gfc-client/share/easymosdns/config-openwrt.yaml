# MosDNS v5 config for ImmortalWrt/OpenWrt.
# dnsmasq keeps LAN :53 and forwards to this instance on 127.0.0.1:1053.
# Keep this marker for the renderer's legacy template check.
# data_providers:
log:
  level: error

plugins:
  - tag: cache
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400
      cache_everything: true

  - tag: forward_local
    type: forward
    args:
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29
        - addr: 114.114.114.114

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      - exec: $forward_local

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053
