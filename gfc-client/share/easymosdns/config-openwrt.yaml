# Minimal mosdns v5 config for ImmortalWrt/OpenWrt bootstrap.
# Keep this marker for the renderer's legacy template check:
# data_providers:
log:
  level: error

plugins:
  - tag: forward_local
    type: forward
    args:
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29

  - tag: main_sequence
    type: sequence
    args:
      - exec: $forward_local

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053
