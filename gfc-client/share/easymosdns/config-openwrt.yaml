log:
  level: error

# Minimal mosdns v5 policy verified against common ImmortalWrt/OpenWrt builds.
# dnsmasq keeps LAN :53 and forwards to this instance on 127.0.0.1:1053.
# gfc_openwrt_mosdns_v6

plugins:
  - tag: china_domain
    type: domain_set
    args:
      files:
        - ./rules/china_domain_list.txt

  - tag: gfw_domain
    type: domain_set
    args:
      files:
        - ./rules/gfw_domain_list.txt

  - tag: cdn_domain
    type: domain_set
    args:
      files:
        - ./rules/cdn_domain_list.txt

  - tag: ad_domain
    type: domain_set
    args:
      files:
        - ./rules/ad_domain_list.txt

  - tag: china_ip
    type: ip_set
    args:
      files:
        - ./rules/china_ip_list.txt

  - tag: cache
    type: cache
    args:
      size: 65536
      lazy_cache_ttl: 86400

  - tag: forward_local
    type: forward
    args:
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29

  - tag: forward_remote
    type: forward
    args:
      upstreams:
        - addr: "https://1.1.1.1/dns-query"
          dial_addr: "1.1.1.1:443"
        - addr: "https://8.8.8.8/dns-query"
          dial_addr: "8.8.8.8:443"

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache

      - matches:
          - qname $ad_domain
        exec: reject 3

      - matches:
          - qname $china_domain
        exec: $forward_local

      - matches:
          - qname $cdn_domain
        exec: $forward_local

      - matches:
          - qname $gfw_domain
        exec: $forward_remote

      - exec: $forward_remote

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:1053
