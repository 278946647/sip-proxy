<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GFC · 线路激活</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- 独立刷码页：可全屏使用，也可从侧栏进入 -->
  <div class="layout" id="layout-full">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>GFC Client</h1>
        <p>智能加速网关</p>
      </div>
      <nav class="nav">
        <a href="/" data-page="dashboard"><span class="nav-icon">◉</span> 运行概览</a>
        <a href="/activate.html" data-page="activate" class="active"><span class="nav-icon">◎</span> 线路激活</a>
        <a href="/settings.html" data-page="settings"><span class="nav-icon">⚙</span> 网络设置</a>
        <a href="/services.html" data-page="services"><span class="nav-icon">▣</span> 服务管理</a>
        <a href="/logs.html" data-page="logs"><span class="nav-icon">≡</span> 系统日志</a>
      </nav>
      <div class="sidebar-footer">离线可刷入线路码</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2>线路激活</h2>
        <div class="topbar-meta" id="activation-status"></div>
      </header>

      <div class="content">
        <div class="alert alert-info">
          将控制平台生成的 Base32 线路码粘贴到下方。刷入后 Agent 会自动重启并尝试激活；无需互联网即可完成刷入，联网后将自动连接控制平台与转发节点。
        </div>

        <div id="alert" hidden></div>

        <div class="panel">
          <div class="panel-header">刷入线路码</div>
          <div class="panel-body">
            <form id="flash-form">
              <div class="form-group">
                <label for="line-code">Base32 线路码</label>
                <textarea id="line-code" placeholder="粘贴线路码（支持多行，自动去除空格）" required></textarea>
                <div class="hint">线路码由控制平台「客户端线路」生成，包含平台地址与线路信息</div>
              </div>
              <div class="form-group">
                <label>
                  <input type="checkbox" id="reset-state" checked />
                  清除旧激活状态（换线时建议勾选）
                </label>
              </div>
              <button type="submit" class="btn btn-primary" id="submit-btn">刷入并激活</button>
            </form>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">当前线路</div>
          <div class="panel-body">
            <table class="kv-table">
              <tr><th>线路码</th><td id="cur-has">—</td></tr>
              <tr><th>线路 TID</th><td id="cur-tid">—</td></tr>
              <tr><th>转发节点</th><td id="cur-node">—</td></tr>
              <tr><th>平台地址</th><td id="cur-servers">—</td></tr>
              <tr><th>设备激活</th><td id="cur-activated">—</td></tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    setActiveNav("activate");

    const alertEl = document.getElementById("alert");
    const form = document.getElementById("flash-form");

    async function loadDevice() {
      try {
        const dev = await API.device();
        const act = dev.activation || {};
        document.getElementById("cur-has").textContent = act.has_line_code ? "已刷入" : "未刷入";
        document.getElementById("cur-tid").textContent = dev.line_tid || act.line_tid || "—";
        document.getElementById("cur-node").textContent = act.node_name || "—";
        document.getElementById("cur-servers").textContent =
          (act.server_urls || []).join(" / ") || "—";
        document.getElementById("cur-activated").innerHTML = dev.activated
          ? statusBadge(true).replace("在线", "已激活")
          : '<span class="badge badge-warn"><span class="badge-dot"></span>待联网激活</span>';
        document.getElementById("activation-status").innerHTML = dev.activated
          ? statusBadge(true)
          : '<span class="badge badge-warn"><span class="badge-dot"></span>待激活</span>';
      } catch (e) {
        console.error(e);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "刷入中…";
      try {
        const code = document.getElementById("line-code").value.replace(/\s+/g, "");
        const reset = document.getElementById("reset-state").checked;
        const res = await API.flashLineCode(code, reset);
        showAlert(alertEl, "success", res.message || "刷入成功");
        document.getElementById("line-code").value = "";
        await loadDevice();
      } catch (err) {
        showAlert(alertEl, "error", err.message || "刷入失败");
      } finally {
        btn.disabled = false;
        btn.textContent = "刷入并激活";
      }
    });

    loadDevice();
    setInterval(loadDevice, 8000);
  </script>
</body>
</html>
