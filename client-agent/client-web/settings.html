<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GFC · 网络设置</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>GFC Client</h1>
        <p>智能加速网关</p>
      </div>
      <nav class="nav">
        <a href="/" data-page="dashboard"><span class="nav-icon">◉</span> 运行概览</a>
        <a href="/activate.html" data-page="activate"><span class="nav-icon">◎</span> 线路激活</a>
        <a href="/settings.html" data-page="settings" class="active"><span class="nav-icon">⚙</span> 网络设置</a>
        <a href="/services.html" data-page="services"><span class="nav-icon">▣</span> 服务管理</a>
        <a href="/logs.html" data-page="logs"><span class="nav-icon">≡</span> 系统日志</a>
      </nav>
      <div class="sidebar-footer">代理模式与网卡</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2>网络设置</h2>
      </header>

      <div class="content">
        <div id="alert" hidden></div>

        <div class="panel">
          <div class="panel-header">LAN 桥接 (bridge_lan)</div>
          <div class="panel-body">
            <p class="hint" style="margin-top:0">
              默认将<strong>最后一块物理网卡</strong>加入桥 <code>bridge_lan</code>，网关 IP <code>192.168.68.1/24</code> 与 DHCP 均绑定在桥上。
            </p>
            <form id="bridge-form">
              <div class="grid-2">
                <div class="form-group">
                  <label for="bridge_name">桥接口名称</label>
                  <input type="text" id="bridge_name" value="bridge_lan" />
                </div>
                <div class="form-group">
                  <label for="bridge_wan">WAN 网卡</label>
                  <select id="bridge_wan"></select>
                </div>
              </div>
              <div class="form-group">
                <label>桥成员（物理口）</label>
                <div id="bridge-members" class="checkbox-list">加载中…</div>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label for="bridge_lan_ip">LAN IP</label>
                  <input type="text" id="bridge_lan_ip" value="192.168.68.1" />
                </div>
                <div class="form-group">
                  <label for="bridge_prefix">前缀长度</label>
                  <input type="number" id="bridge_prefix" min="8" max="30" value="24" />
                </div>
              </div>
              <button type="submit" class="btn btn-primary">应用桥接配置</button>
            </form>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">基本配置</div>
          <div class="panel-body">
            <form id="settings-form">
              <div class="form-group">
                <label for="device_name">设备名称</label>
                <input type="text" id="device_name" />
              </div>
              <div class="form-group">
                <label for="proxy_mode">代理模式</label>
                <select id="proxy_mode">
                  <option value="gateway">网关模式 — TUN 全局路由 + NAT</option>
                  <option value="bypass">旁路模式 — TUN 不接管默认路由</option>
                  <option value="transparent">透明模式 — LAN 侧 TPROXY</option>
                </select>
                <div class="hint">透明模式需指定 LAN 网卡</div>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label for="lan_iface">LAN 网卡</label>
                  <select id="lan_iface"><option value="">— 自动 —</option></select>
                </div>
                <div class="form-group">
                  <label for="wan_iface">WAN 网卡</label>
                  <select id="wan_iface"><option value="">— 自动 —</option></select>
                </div>
              </div>
              <div class="form-group">
                <label for="poll_seconds">配置轮询间隔（秒）</label>
                <input type="number" id="poll_seconds" min="5" max="300" value="10" />
              </div>
              <button type="submit" class="btn btn-primary">保存设置</button>
            </form>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">控制平台地址（可选覆盖）</div>
          <div class="panel-body">
            <div class="form-group">
              <label for="server_url">主地址</label>
              <input type="text" id="server_url" placeholder="http://控制平台:8080" />
              <div class="hint">通常由线路码自动写入，仅在特殊网络环境手动覆盖</div>
            </div>
            <div class="form-group">
              <label for="server_url_fallback">备用地址</label>
              <input type="text" id="server_url_fallback" placeholder="http://备用IP:8080" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    setActiveNav("settings");

    const alertEl = document.getElementById("alert");
    const lanSel = document.getElementById("lan_iface");
    const wanSel = document.getElementById("wan_iface");

    function fillIfaceSelect(sel, current) {
      const keep = sel.value;
      sel.innerHTML = '<option value="">— 自动 —</option>';
      return API.interfaces().then((data) => {
        (data.interfaces || []).forEach((iface) => {
          const opt = document.createElement("option");
          opt.value = iface.name;
          const addr = (iface.addresses || [])[0];
          const ip = addr ? ` ${addr.address}` : "";
          opt.textContent = `${iface.name} (${iface.state})${ip}`;
          sel.appendChild(opt);
        });
        sel.value = current || keep || "";
      });
    }

    async function load() {
      const s = await API.settings();
      document.getElementById("device_name").value = s.device_name || "";
      document.getElementById("proxy_mode").value = s.proxy_mode || "gateway";
      document.getElementById("poll_seconds").value = s.poll_seconds || 10;
      document.getElementById("server_url").value = s.server_url || "";
      document.getElementById("server_url_fallback").value = s.server_url_fallback || "";
      await fillIfaceSelect(lanSel, s.lan_iface);
      await fillIfaceSelect(wanSel, s.wan_iface);
    }

    document.getElementById("settings-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      try {
        const data = {
          device_name: document.getElementById("device_name").value.trim(),
          proxy_mode: document.getElementById("proxy_mode").value,
          lan_iface: lanSel.value,
          wan_iface: wanSel.value,
          poll_seconds: parseInt(document.getElementById("poll_seconds").value, 10),
          server_url: document.getElementById("server_url").value.trim(),
          server_url_fallback: document.getElementById("server_url_fallback").value.trim(),
        };
        const res = await API.saveSettings(data);
        showAlert(alertEl, "success", res.agent_restarted ? "已保存，Agent 已重启" : "已保存");
      } catch (err) {
        showAlert(alertEl, "error", err.message);
      }
    });

    async function loadBridge() {
      const data = await API.bridgeNetwork();
      const cfg = data.config || {};
      const phys = (data.status && data.status.interfaces) || [];
      document.getElementById("bridge_name").value = cfg.bridgeName || "bridge_lan";
      document.getElementById("bridge_lan_ip").value = cfg.lanAddress || "192.168.68.1";
      document.getElementById("bridge_prefix").value = cfg.lanPrefix || 24;

      const wanSel = document.getElementById("bridge_wan");
      wanSel.innerHTML = "";
      phys.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        wanSel.appendChild(opt);
      });
      wanSel.value = cfg.wan || phys[0] || "";

      const members = new Set(cfg.members || []);
      const box = document.getElementById("bridge-members");
      box.innerHTML = phys
        .filter((n) => n !== wanSel.value)
        .map(
          (name) => `<label class="check-row"><input type="checkbox" name="member" value="${name}" ${
            members.has(name) ? "checked" : ""
          } /> ${name}</label>`
        )
        .join("");
    }

    document.getElementById("bridge-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const members = [...document.querySelectorAll('#bridge-members input[name="member"]:checked')].map(
        (el) => el.value
      );
      try {
        const res = await API.applyBridgeNetwork({
          bridgeName: document.getElementById("bridge_name").value.trim(),
          wan: document.getElementById("bridge_wan").value,
          members,
          lanAddress: document.getElementById("bridge_lan_ip").value.trim(),
          lanPrefix: parseInt(document.getElementById("bridge_prefix").value, 10),
        });
        showAlert(alertEl, "success", res.message || "桥接已应用");
        await loadBridge();
      } catch (err) {
        showAlert(alertEl, "error", err.message);
      }
    });

    Promise.all([load(), loadBridge()]).catch((e) => showAlert(alertEl, "error", e.message));
  </script>
</body>
</html>
