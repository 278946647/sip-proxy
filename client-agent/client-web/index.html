<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GFC 客户端盒子 · 控制台</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>GFC Client</h1>
        <p>智能加速网关</p>
      </div>
      <nav class="nav">
        <a href="/" data-page="dashboard" class="active"><span class="nav-icon">◉</span> 运行概览</a>
        <a href="http://192.168.68.1:81/" data-page="activate" target="_blank"><span class="nav-icon">◎</span> 刷入线路码 (:81)</a>
        <a href="/settings.html" data-page="settings"><span class="nav-icon">⚙</span> 网络设置</a>
        <a href="/services.html" data-page="services"><span class="nav-icon">▣</span> 服务管理</a>
        <a href="/logs.html" data-page="logs"><span class="nav-icon">≡</span> 系统日志</a>
      </nav>
      <div class="sidebar-footer">v<span id="ver">—</span> · 本地管理</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2>运行概览</h2>
        <div class="topbar-meta">
          <span id="device-name">—</span>
          <span id="cp-status"></span>
        </div>
      </header>

      <div class="content">
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">CPU 使用率</div>
            <div class="stat-value"><span id="cpu">—</span><span class="stat-unit">%</span></div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">下行速率</div>
            <div class="stat-value"><span id="down">—</span><span class="stat-unit">Mbps</span></div>
            <div class="traffic-bar"><div class="traffic-bar-fill" id="down-bar" style="width:0%"></div></div>
          </div>
          <div class="stat-card orange">
            <div class="stat-label">上行速率</div>
            <div class="stat-value"><span id="up">—</span><span class="stat-unit">Mbps</span></div>
            <div class="traffic-bar"><div class="traffic-bar-fill" id="up-bar" style="width:0%"></div></div>
          </div>
          <div class="stat-card purple">
            <div class="stat-label">活跃连接</div>
            <div class="stat-value"><span id="conns">—</span></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">网络 (OpenWrt 模式)</div>
          <div class="panel-body">
            <table class="kv-table">
              <tr><th>WAN 网卡</th><td id="net-wan">—</td></tr>
              <tr><th>LAN 网卡</th><td id="net-lan">—</td></tr>
              <tr><th>LAN 地址</th><td id="net-lan-addr">192.168.68.1/24</td></tr>
              <tr><th>DHCP 池</th><td id="net-dhcp">—</td></tr>
            </table>
          </div>
        </div>

        <div class="grid-2">
          <div class="panel">
            <div class="panel-header">设备信息</div>
            <div class="panel-body">
              <table class="kv-table">
                <tr><th>设备名称</th><td id="kv-name">—</td></tr>
                <tr><th>主机名</th><td id="kv-host">—</td></tr>
                <tr><th>MAC 地址</th><td id="kv-mac">—</td></tr>
                <tr><th>激活状态</th><td id="kv-activated">—</td></tr>
                <tr><th>线路 TID</th><td id="kv-tid">—</td></tr>
                <tr><th>代理模式</th><td id="kv-mode">—</td></tr>
                <tr><th>BBR</th><td id="kv-bbr">—</td></tr>
              </table>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">服务管理</div>
            <div class="panel-body" id="svc-summary">加载中…</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">控制平台</div>
          <div class="panel-body">
            <table class="kv-table">
              <tr><th>平台地址</th><td id="kv-cp-url">—</td></tr>
              <tr><th>连通状态</th><td id="kv-cp-reach">—</td></tr>
              <tr><th>配置版本</th><td id="kv-version">—</td></tr>
              <tr><th>内存</th><td id="kv-mem">—</td></tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    setActiveNav("dashboard");

    function barWidth(mbps, peak) {
      const base = Math.max(peak || 1, 1);
      return Math.min(100, (mbps / base) * 100).toFixed(0);
    }

    async function refresh() {
      try {
        const data = await API.status();
        const dev = data.device || {};
        const m = data.metrics || {};
        const net = data.network || {};

        document.getElementById("net-wan").textContent = net.wan || "—";
        document.getElementById("net-lan").textContent = net.lan || "—";
        document.getElementById("net-lan-addr").textContent =
          net.lanAddress ? `${net.lanAddress}/${net.lanPrefix || 24}` : "192.168.68.1/24";
        const dhcp = net.dhcp || {};
        document.getElementById("net-dhcp").textContent = dhcp.enabled
          ? `${dhcp.start} – ${dhcp.end}`
          : "未启用";

        document.getElementById("ver").textContent = dev.agent_version || "—";
        document.getElementById("device-name").textContent = dev.device_name || dev.hostname || "—";
        document.getElementById("cp-status").innerHTML = statusBadge(!!m.control_plane_reachable);

        document.getElementById("cpu").textContent = fmtPct(m.cpu_percent).replace("%", "");
        document.getElementById("down").textContent = fmtMbps(m.download_mbps);
        document.getElementById("up").textContent = fmtMbps(m.upload_mbps);
        document.getElementById("conns").textContent = m.connection_count ?? "—";

        const peakDown = m.download_peak_mbps || m.download_mbps || 1;
        const peakUp = m.upload_peak_mbps || m.upload_mbps || 1;
        document.getElementById("down-bar").style.width = barWidth(m.download_mbps || 0, peakDown) + "%";
        document.getElementById("up-bar").style.width = barWidth(m.upload_mbps || 0, peakUp) + "%";

        document.getElementById("kv-name").textContent = dev.device_name || "—";
        document.getElementById("kv-host").textContent = dev.hostname || "—";
        document.getElementById("kv-mac").textContent = dev.mac || "—";
        document.getElementById("kv-activated").innerHTML = dev.activated
          ? '<span class="badge badge-ok"><span class="badge-dot"></span>已激活</span>'
          : '<span class="badge badge-warn"><span class="badge-dot"></span>待激活</span>';
        document.getElementById("kv-tid").textContent = dev.line_tid || "—";
        document.getElementById("kv-mode").textContent = dev.proxy_mode || "—";
        const devNet = dev.network || {};
        document.getElementById("kv-bbr").textContent =
          devNet.tcp_congestion_control === "bbr" ? "已启用 BBR" : (devNet.tcp_congestion_control || "—");

        const svcs = m.services || {};
        const rows = ["sing-box", "mosdns"].map((name) => {
          const s = svcs[name] || {};
          return `<div class="service-row">
            <div><div class="service-name">${name}</div>
            <div class="service-status">${s.status || "unknown"}</div></div>
            ${serviceBadge(!!s.active)}
          </div>`;
        });
        document.getElementById("svc-summary").innerHTML = rows.join("");

        document.getElementById("kv-cp-url").textContent = dev.control_plane_url || "（线路码内嵌）";
        document.getElementById("kv-cp-reach").innerHTML = statusBadge(!!m.control_plane_reachable);
        document.getElementById("kv-version").textContent = dev.applied_version || "—";
        document.getElementById("kv-mem").textContent = fmtMem(m.memory_used_mb, m.memory_total_mb);
      } catch (e) {
        console.error(e);
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
